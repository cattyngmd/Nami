name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Get version from Gradle
        id: version
        run: echo "version=$(./gradlew -q printVersion)" >> $GITHUB_OUTPUT

      - name: Create tag if not exists
        id: tag
        run: |
          TAG="${{ steps.version.outputs.version }}"
          if [[ "$TAG" != v* ]]; then
            TAG="v$TAG"
          fi

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "tag_exists=true" >> $GITHUB_OUTPUT
            echo "Tag $TAG already exists"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
            echo "tag_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build
        run: ./gradlew clean build remapJar --stacktrace

      - name: Rename JARs
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          for jar in build/libs/*.jar; do
            BASENAME=$(basename "$jar")
            mv "$jar" "build/libs/nami-${VERSION}-${BASENAME}"
          done

      - name: Create GitHub Release & upload assets
        if: steps.tag.outputs.tag_exists == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          body: "${{ steps.version.outputs.version }}"
          files: build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
