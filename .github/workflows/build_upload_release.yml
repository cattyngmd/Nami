name: build_upload_release

on:
  workflow_dispatch:

jobs:
  build_and_release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew clean build remapJar --stacktrace

      - name: Set safe branch name
        run: |
          SAFE_BRANCH="${{ github.ref_name }}"
          SAFE_BRANCH="${SAFE_BRANCH//./-}"
          echo "SAFE_BRANCH=$SAFE_BRANCH" >> $GITHUB_ENV

      - name: Rename JARs
        run: |
          for jar in build/libs/*.jar; do
            BASENAME=$(basename "$jar")
            mv "$jar" "build/libs/nami-${SAFE_BRANCH}-${BASENAME}"
          done

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.SAFE_BRANCH }}
          name: ${{ env.SAFE_BRANCH }}
          body: "Automated release from branch `${{ github.ref_name }}`"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.SAFE_BRANCH }}
          name: ${{ env.SAFE_BRANCH }}
          files: build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
