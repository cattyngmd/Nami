name: build upload release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Get version
        id: version
        run: echo "version=$(./gradlew -q printVersion)" >> $GITHUB_OUTPUT

      - name: Create tag
        id: tag
        run: |
          TAG="${{ steps.version.outputs.version }}"
          if [[ "$TAG" != v* ]]; then
            TAG="v$TAG"
          fi

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "tag_exists=true" >> $GITHUB_OUTPUT
            echo "Tag $TAG already exists"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
            echo "tag_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate release body
        id: release_body
        run: |
          # last tag (before current)
          LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          # current tag
          TAG="${{ steps.version.outputs.version }}"
          if [[ "$TAG" != v* ]]; then
            TAG="v$TAG"
          fi

          # commits list
          if [[ -z "$LAST_TAG" ]]; then
            COMMITS=$(git log --pretty=format:'- %s by @%an' "$TAG")
          else
            COMMITS=$(git log "$LAST_TAG..$TAG" --pretty=format:'- %s by @%an')
          fi

          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build
        run: ./gradlew clean build remapJar --stacktrace

      - name: Rename JAR
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          for jar in build/libs/*.jar; do
            BASENAME=$(basename "$jar")
            mv "$jar" "build/libs/nami-${VERSION}-${BASENAME}"
          done

      - name: Upload release
        if: steps.tag.outputs.tag_exists == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          body: ${{ steps.release_body.outputs.body }}
          files: build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
