name: build upload artifact

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1' ## each monday

jobs:
  build:
    if: github.actor == 'Kiriyaga7615' || github.event_name == 'schedule'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        branch:
          - 1.21.11
          - 1.21.8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          ref: ${{ matrix.branch }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew clean build remapJar --stacktrace

      - name: Set safe branch name
        run: |
          SAFE_BRANCH="${{ matrix.branch }}"
          SAFE_BRANCH="${SAFE_BRANCH//./-}"
          echo "SAFE_BRANCH=$SAFE_BRANCH" >> $GITHUB_ENV

      - name: Rename JARs
        run: |
          for jar in build/libs/*.jar; do
            BASENAME=$(basename "$jar")
            mv "$jar" "build/libs/nami-${SAFE_BRANCH}-${BASENAME}"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nami-${{ env.SAFE_BRANCH }}
          path: build/libs/*.jar
          retention-days: 14
